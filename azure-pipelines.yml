# Maven
# Build your Java project and run tests with Apache Maven.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java

trigger:
- main

pool:
  name: Default

stages:
- stage: Build
  displayName: Compilar y analizar
  jobs:
  - job: Maven
    steps:
    - task: Maven@3
      env:
        SNYK_TOKEN: $(SNYK_TOKEN)
      inputs:
        mavenPomFile: 'pom.xml'
        mavenOptions: '-Xmx3072m'
        javaHomeOption: 'Path'
        jdkDirectory: 'C:\Program Files\Java\jdk-21'
        jdkArchitectureOption: 'x64'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        goals: 'verify'

- stage: Practica
  displayName: Etapa vacia
  dependsOn: Build
  jobs:
  - job: Nada
    steps:
    - checkout: none
    - powershell: |
        $ahora = Get-Date
        Write-Host "Hora del agente: $($ahora.ToString('HH:mm'))"
        if ($ahora.Hour -lt 14) {
          Write-Host "Son menos de las 14:00. El proceso no puede terminar."
          exit 1
        }
        Write-Host "Ya pasaron las 14:00. La etapa puede terminar."
      displayName: Bloquear antes de las 14:00

- stage: Desplegar
  displayName: OpenShift
  dependsOn:
  - Build
  - Practica
  jobs:
  - job: Publicar
    steps:
    - checkout: self
    - script: |
        oc login --token=$(OPENSHIFT_TOKEN) --server=$(OPENSHIFT_SERVER)
        oc project dikson88512-dev
        oc start-build helloworld --follow
      displayName: Construir y desplegar
